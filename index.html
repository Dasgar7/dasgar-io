<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f2fbff">
<title>Dasgar.io</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/hud.css">
<link rel="stylesheet" href="css/menu.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <button id="pauseBtn" aria-label="Pause"><span></span><span></span></button>
  <div id="score"><div id="scoreMain">Score 0</div><div id="scoreSub"></div></div>
  <div id="leaderboard"><h4 id="lbHead"><span>Leaderboard</span><span id="lbArrow">&#9662;</span></h4><ol id="lbList"></ol></div>
  <canvas id="minimap" width="120" height="120"></canvas>
</div>

<div id="touch" class="hidden">
  <div id="stick"><div id="knob"></div></div>
  <button id="btnEject" aria-label="Feed"><svg viewBox="0 0 48 48"><circle cx="16" cy="24" r="10"/><circle cx="35" cy="24" r="4"/><circle cx="43" cy="24" r="2.2"/></svg></button>
  <button id="btnSplit" aria-label="Split"><svg viewBox="0 0 48 48"><circle cx="14" cy="24" r="9.5"/><circle cx="34" cy="24" r="9.5"/><path d="M24 8v32" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 5" fill="none"/></svg></button>
</div>

<div id="menu">
  <h1>Dasgar<span>.io</span></h1>
  <input id="nameInput" maxlength="14" placeholder="Nickname" autocomplete="off">
  <div id="skins"></div>
  <button id="playBtn">PLAY</button>
  <p class="help">Desktop: mouse to move, SPACE split, W feed, scroll to zoom<br>Mobile: joystick to move, buttons to split and feed</p>
</div>

<div id="dead" class="hidden">
  <h2>You were eaten!</h2>
  <p id="deadStats"></p>
  <button id="againBtn">PLAY AGAIN</button>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/input.js"></script>
<script src="js/entities.js"></script>
<script src="js/ai.js"></script>
<script src="js/world.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
