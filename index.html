<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f2fbff">
<title>Dasgar.io</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/hud.css">
<link rel="stylesheet" href="css/menu.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <button id="pauseBtn" aria-label="Pause"><span></span><span></span></button>
  <div id="score"><div id="scoreMain">Score 0</div><div id="scoreSub"></div></div>
  <button id="lbBtn" aria-label="Leaderboard"><svg viewBox="0 0 48 48"><rect x="17" y="10" width="14" height="28" rx="2"/><rect x="3" y="21" width="13" height="17" rx="2"/><rect x="32" y="27" width="13" height="11" rx="2"/></svg></button>
  <div id="leaderboard" class="collapsed"><h4>Leaderboard</h4><ol id="lbList"></ol></div>
  <canvas id="minimap" width="120" height="120"></canvas>
</div>

<div id="touch" class="hidden">
  <div id="stick"><div id="knob"></div></div>
  <button id="btnEject" aria-label="Feed"><svg viewBox="0 0 48 48"><circle cx="16" cy="24" r="10"/><circle cx="35" cy="24" r="4"/><circle cx="43" cy="24" r="2.2"/></svg></button>
  <button id="btnSplit" aria-label="Split"><svg viewBox="0 0 48 48"><circle cx="14" cy="24" r="9.5"/><circle cx="34" cy="24" r="9.5"/><path d="M24 8v32" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 5" fill="none"/></svg></button>
</div>

<div id="menu">
  <div id="menuCoins"><i class="coin"></i><b class="gold" id="coinCount">0</b><i class="gem"></i><b class="green" id="gemCount">0</b></div>
  <div id="logoWrap">
    <h1 id="logo"><img src="img/logo.webp" alt="DASGAR.IO" width="919" height="189" decoding="async"></h1>
  </div>
  <div class="menuCol left">
    <button class="mbtn" data-open="shop" aria-label="Shop"><svg viewBox="0 0 48 48" fill="currentColor"><path d="M4 8h7l5 22h22l4-16H14" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="39" r="3.5"/><circle cx="34" cy="39" r="3.5"/></svg><span>Shop</span></button>
    <button class="mbtn" data-open="settings" aria-label="Settings"><svg viewBox="0 0 48 48" fill="currentColor"><circle cx="24" cy="24" r="10" fill="none" stroke="currentColor" stroke-width="6"/><rect x="21" y="2" width="6" height="9" rx="1.5" transform="rotate(0 24 24)"/><rect x="21" y="2" width="6" height="9" rx="1.5" transform="rotate(45 24 24)"/><rect x="21" y="2" width="6" height="9" rx="1.5" transform="rotate(90 24 24)"/><rect x="21" y="2" width="6" height="9" rx="1.5" transform="rotate(135 24 24)"/><rect x="21" y="2" width="6" height="9" rx="1.5" transform="rotate(180 24 24)"/><rect x="21" y="2" width="6" height="9" rx="1.5" transform="rotate(225 24 24)"/><rect x="21" y="2" width="6" height="9" rx="1.5" transform="rotate(270 24 24)"/><rect x="21" y="2" width="6" height="9" rx="1.5" transform="rotate(315 24 24)"/></svg><span>Settings</span></button>
    <button class="mbtn" data-open="friends" aria-label="Friends"><svg viewBox="0 0 48 48" fill="currentColor"><circle cx="17" cy="16" r="7"/><path d="M3 41c0-9 6-14 14-14s14 5 14 14z"/><circle cx="34" cy="18" r="6" opacity=".75"/><path d="M30 28c8-2 15 3 15 13H33c0-5-1-9-3-13z" opacity=".75"/></svg><span>Friends</span></button>
  </div>
  <div class="menuCol right">
    <button class="mbtn" data-open="leaderboard" aria-label="Leaderboard"><svg viewBox="0 0 48 48" fill="currentColor"><path d="M14 6h20v12a10 10 0 0 1-20 0z"/><path d="M14 10H6c0 8 3 12 9 13M34 10h8c0 8-3 12-9 13" fill="none" stroke="currentColor" stroke-width="3.5"/><rect x="21" y="28" width="6" height="8"/><rect x="14" y="38" width="20" height="5" rx="2"/></svg><span>Leaderboard</span></button>
    <button class="mbtn" data-open="daily" aria-label="Daily"><svg viewBox="0 0 48 48" fill="currentColor"><rect x="10" y="5" width="28" height="38" rx="4"/><path d="M17 15h14M17 22h14M17 29h9" stroke="#07200d" stroke-width="3" stroke-linecap="round"/><circle cx="10" cy="12" r="2.4" fill="#07200d"/><circle cx="10" cy="22" r="2.4" fill="#07200d"/><circle cx="10" cy="32" r="2.4" fill="#07200d"/></svg><span>Daily</span></button>
    <button class="mbtn" data-open="help" aria-label="Help"><svg viewBox="0 0 48 48" fill="currentColor"><text x="24" y="39" text-anchor="middle" font-size="42" font-weight="900" font-family="Arial, sans-serif">?</text></svg><span>Help</span></button>
  </div>
  <div id="menuPanel">
    <div class="tab">Enter nickname</div>
    <input id="nameInput" maxlength="14" placeholder="Player" autocomplete="off">
    <div id="skins"></div>
    <button id="playBtn">PLAY</button>
    <div class="ver">Version 0.1.0 &middot; Play against bots</div>
  </div>
  <div id="modal" class="hidden"><div class="card"><h3 id="modalTitle"></h3><div id="modalBody"></div><button id="modalClose">Close</button></div></div>
</div>

<div id="dead" class="hidden">
  <h2>You were eaten!</h2>
  <p id="deadStats"></p>
  <button id="againBtn">PLAY AGAIN</button>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/input.js"></script>
<script src="js/entities.js"></script>
<script src="js/ai.js"></script>
<script src="js/world.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
