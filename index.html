<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/manifest.json" />
    <title>Dasgar.io</title>
    <style>
      /* Force disable ALL selection and long-press callouts on iOS/Android */
      html, body {
        overflow: hidden !important;
        overflow-x: hidden !important;
        overflow-y: hidden !important;
        width: 100% !important;
        height: 100% !important;
        margin: 0;
        padding: 0;
        position: fixed !important;
        touch-action: manipulation !important;
        overscroll-behavior: none !important;
      }
      
      html, body, *, *:before, *:after {
        -webkit-user-drag: none !important;
        user-drag: none !important;
        -webkit-touch-callout: none !important;
        -webkit-user-select: none !important;
        -khtml-user-select: none !important;
        -moz-user-select: none !important;
        -ms-user-select: none !important;
        user-select: none !important;
        -webkit-tap-highlight-color: rgba(0,0,0,0) !important;
        -webkit-tap-highlight-color: transparent !important;
      }

      /* Protect all icons and inner contents of buttons from receiving pointer events */
      img, svg, svg * {
        pointer-events: none !important;
        -webkit-user-drag: none !important;
        user-drag: none !important;
        -webkit-touch-callout: none !important;
        user-select: none !important;
      }

      [role="button"] > *, button > * {
        pointer-events: none !important;
        -webkit-user-drag: none !important;
        user-drag: none !important;
        -webkit-touch-callout: none !important;
        user-select: none !important;
      }
      
      /* Allow selection and pointer interaction ONLY on inputs */
      input, textarea {
        -webkit-touch-callout: default !important;
        -webkit-user-select: auto !important;
        -khtml-user-select: auto !important;
        -moz-user-select: auto !important;
        -ms-user-select: auto !important;
        user-select: auto !important;
        pointer-events: auto !important;
      }
    </style>
    <script>
      // CRITICAL NATIVE FIX: physically intercept and kill all drag events at the root browser level
      document.addEventListener('dragstart', function(e){ e.preventDefault(); }, { passive: false, capture: true });
      document.addEventListener('drop', function(e){ e.preventDefault(); }, { passive: false, capture: true });

      // Cleanly handle Vite HMR WebSocket connection in iframe preview environment
      (function() {
        var isViteHmr = function(str) {
          if (!str) return false;
          var s = String(str);
          return (
            s.indexOf('WebSocket') !== -1 ||
            s.indexOf('vite:ws') !== -1 ||
            s.indexOf('[vite]') !== -1 ||
            s.indexOf('@vite/client') !== -1
          );
        };

        // If Vite client attempts WebSocket connection in HMR-disabled preview, provide mock open socket
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite-hmr') !== -1))) {
              var target = new EventTarget();
              var ws = {
                url: url,
                readyState: 1,
                OPEN: 1,
                CLOSED: 3,
                CLOSING: 2,
                CONNECTING: 0,
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                send: function() {},
                close: function() { ws.readyState = 3; },
                addEventListener: target.addEventListener.bind(target),
                removeEventListener: target.removeEventListener.bind(target),
                dispatchEvent: target.dispatchEvent.bind(target),
                set onopen(fn) { target.addEventListener('open', fn); },
                set onmessage(fn) { target.addEventListener('message', fn); },
                set onclose(fn) { target.addEventListener('close', fn); },
                set onerror(fn) { target.addEventListener('error', fn); }
              };
              setTimeout(function() {
                var openEvt = new Event('open');
                target.dispatchEvent(openEvt);
              }, 10);
              return ws;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
        }

        // Intercept console.error / warn for Vite client messages
        var origConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (arg) {
              if (isViteHmr(arg) || isViteHmr(arg.message) || isViteHmr(arg.stack)) {
                return;
              }
            }
          }
          return origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (arg) {
              if (isViteHmr(arg) || isViteHmr(arg.message) || isViteHmr(arg.stack)) {
                return;
              }
            }
          }
          return origConsoleWarn.apply(console, arguments);
        };

        // Capture-phase event suppressors
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.message || String(reason))) || '';
          var stack = (reason && reason.stack) || '';
          if (isViteHmr(msg) || isViteHmr(stack)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.stopPropagation) event.stopPropagation();
            return true;
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || '')) || '';
          var file = (event && (event.filename || '')) || '';
          var error = event && event.error;
          var stack = (error && error.stack) || '';
          if (isViteHmr(msg) || isViteHmr(file) || isViteHmr(stack)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.stopPropagation) event.stopPropagation();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
