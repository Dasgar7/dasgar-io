<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f2fbff">
<title>Dasgar.io</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="score">Mass: 0</div>
  <div id="leaderboard"><h4>Leaderboard</h4><ol id="lbList"></ol></div>
  <canvas id="minimap" width="120" height="120"></canvas>
</div>

<div id="touch" class="hidden">
  <div id="stick"><div id="knob"></div></div>
  <button id="btnSplit">SPLIT</button>
  <button id="btnEject">FEED</button>
</div>

<div id="menu">
  <h1>Dasgar<span>.io</span></h1>
  <input id="nameInput" maxlength="14" placeholder="Nickname" autocomplete="off">
  <div id="skins"></div>
  <button id="playBtn">PLAY</button>
  <p class="help">Desktop: mouse to move, SPACE split, W feed, scroll to zoom<br>Mobile: joystick to move, buttons to split and feed</p>
</div>

<div id="dead" class="hidden">
  <h2>You were eaten!</h2>
  <p id="deadStats"></p>
  <button id="againBtn">PLAY AGAIN</button>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/input.js"></script>
<script src="js/entities.js"></script>
<script src="js/ai.js"></script>
<script src="js/world.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
