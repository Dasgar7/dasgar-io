<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/manifest.json" />
    <title>Dasgar.io</title>
    <style>
      /* Force disable ALL selection and long-press callouts on iOS/Android */
      html, body {
        overflow: hidden !important;
        overflow-x: hidden !important;
        overflow-y: hidden !important;
        width: 100% !important;
        height: 100% !important;
        margin: 0;
        padding: 0;
        position: fixed !important;
        touch-action: manipulation !important;
        overscroll-behavior: none !important;
      }
      
      html, body, *, *:before, *:after {
        -webkit-user-drag: none !important;
        user-drag: none !important;
        -webkit-touch-callout: none !important;
        -webkit-user-select: none !important;
        -khtml-user-select: none !important;
        -moz-user-select: none !important;
        -ms-user-select: none !important;
        user-select: none !important;
        -webkit-tap-highlight-color: rgba(0,0,0,0) !important;
        -webkit-tap-highlight-color: transparent !important;
      }

      /* Protect all icons and inner contents of buttons from receiving pointer events */
      img, svg, svg * {
        pointer-events: none !important;
        -webkit-user-drag: none !important;
        user-drag: none !important;
        -webkit-touch-callout: none !important;
        user-select: none !important;
      }

      [role="button"] > *, button > * {
        pointer-events: none !important;
        -webkit-user-drag: none !important;
        user-drag: none !important;
        -webkit-touch-callout: none !important;
        user-select: none !important;
      }
      
      /* Allow selection and pointer interaction ONLY on inputs */
      input, textarea {
        -webkit-touch-callout: default !important;
        -webkit-user-select: auto !important;
        -khtml-user-select: auto !important;
        -moz-user-select: auto !important;
        -ms-user-select: auto !important;
        user-select: auto !important;
        pointer-events: auto !important;
      }
    </style>
    <script>
      // CRITICAL NATIVE FIX: physically intercept and kill all drag events at the root browser level
      document.addEventListener('dragstart', function(e){ e.preventDefault(); }, { passive: false, capture: true });
      document.addEventListener('drop', function(e){ e.preventDefault(); }, { passive: false, capture: true });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
